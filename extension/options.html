<!doctype html>
<meta charset="utf-8">
<title>ff-draft-bot sidebar options</title>
<style>
  body { font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
         sans-serif; margin: 24px; max-width: 460px; color: #14261a; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  p.muted { color: #47624f; font-size: 13px; margin-top: 0; }
  label { display: block; font-weight: 600; margin: 18px 0 6px; }
  input { font: inherit; padding: 6px 8px; width: 120px;
          border: 1px solid #cfe6c3; }
  button { font: inherit; margin-top: 16px; padding: 7px 14px; cursor: pointer;
           border: 1px solid #cfe6c3; background: #f4f9ef; }
  .ok { color: #147a4a; margin-left: 10px; font-size: 13px; }
</style>
<h1>ff-draft-bot sidebar</h1>
<p class="muted">
  The sidebar embeds the panel served on your own machine. Set the port you
  start it on. It never reads or automates the Sleeper page.
</p>
<label for="serverUrl">Server URL</label>
<input id="serverUrl" type="url" style="width:100%"
       placeholder="https://YOUR_DOMAIN (empty = local panel)">
<p class="muted">Leave empty to use a panel running on this computer.</p>
<label for="port">Local panel port</label>
<input id="port" type="number" min="1" max="65535" step="1">
<div><button id="save" type="button">Save</button><span id="ok" class="ok"></span></div>
<script src="options.js"></script>
